version: "3.9"

# ── DjoHealth — Docker Compose ────────────────────────────────────────────────
# Starts the FastAPI backend + a PostgreSQL database.
# The Expo mobile app and Vite web dashboard run locally (not containerised).
#
# Usage:
#   docker-compose up -d          # start in background
#   docker-compose logs -f api    # stream API logs
#   docker-compose down           # stop and remove containers
#   docker-compose down -v        # also remove the database volume (⚠ deletes data)

services:

  # ── PostgreSQL database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: djohealth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-hospital_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hospital_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: djohealth_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-hospital_db}
      SECRET_KEY:          ${SECRET_KEY:-change-this-in-production}
      GEMINI_API_KEY:      ${GEMINI_API_KEY:-}
      GEMINI_SSL_VERIFY:   ${GEMINI_SSL_VERIFY:-true}
      TRANSLATION_API_URL: ${TRANSLATION_API_URL:-}
      AUTO_CREATE_TABLES:  ${AUTO_CREATE_TABLES:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local
